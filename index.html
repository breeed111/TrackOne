<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackOne - Fitness Tracker</title>

  <!-- App Icon für Home-Bildschirm -->
  <link rel="apple-touch-icon" href="icon-192x192.png">

  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <style>
    :root {
      --bg: #2b2e33;
      --surface: #34383e;
      --line: #474c54;
      --text: #e9eaec;
      --muted: #959ba3;
      --placeholder: #767c85;
      --accent: #4a8559;
      --danger: #d06a63;
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.4;
    }

    #app {
      max-width: 560px;
      margin: 0 auto;
      padding: 16px 16px 96px;
    }

    h1 { font-size: 1.4rem; font-weight: 600; margin: 0; }
    h2 { font-size: 1.1rem; font-weight: 600; margin: 24px 0 10px; }
    h3 { font-size: 1rem; font-weight: 600; margin: 0; }
    p { margin: 0 0 10px; }

    .muted { color: var(--muted); font-size: 0.9rem; }

    /* Buttons */
    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      background: none;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 12px 14px;
    }
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .primary {
      width: 100%;
      margin-top: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .secondary {
      background: var(--surface);
      border-color: var(--line);
    }
    .link {
      padding: 6px 4px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .link.danger { color: var(--danger); }

    /* Eingabefelder */
    input[type="text"],
    input[type="number"] {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 11px 12px;
      font: inherit;
    }
    input::placeholder { color: var(--placeholder); }

    /* Kopfzeile */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .who { font-weight: 600; }
    .top-actions { display: flex; gap: 4px; }
    .date { color: var(--muted); margin: 4px 0 12px; }
    .day-title { margin: 12px 0 2px; }

    /* Tagesfolge */
    .steps {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 4px;
    }
    .step {
      flex: 0 0 auto;
      padding: 8px 14px;
      background: var(--surface);
      border-color: var(--line);
      color: var(--muted);
    }
    .step.on {
      border-color: var(--accent);
      color: var(--text);
      font-weight: 600;
    }

    /* Karten */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card-head,
    .day-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .day-head .day-name { flex: 1; font-weight: 600; }
    .check {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 0.9rem;
      white-space: nowrap;
    }

    /* Übungsauswahl */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
    .chip {
      padding: 8px 12px;
      background: var(--bg);
      border-color: var(--line);
      color: var(--muted);
      font-size: 0.92rem;
    }
    .chip.on {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .add-row { display: flex; gap: 8px; }
    .add-row .secondary { white-space: nowrap; }

    /* Sätze */
    .set-head,
    .set-row {
      display: grid;
      grid-template-columns: 36px 1fr 1fr;
      gap: 8px;
      align-items: center;
    }
    .set-head { color: var(--muted); font-size: 0.85rem; margin-bottom: 6px; }
    .set-row { margin-bottom: 8px; }
    .set-no { color: var(--muted); text-align: center; }
    .set-actions { display: flex; justify-content: space-between; }

    /* Profile und Planauswahl */
    .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .row-main {
      flex: 1;
      text-align: left;
      background: var(--surface);
      border-color: var(--line);
      font-weight: 600;
    }
    .choice {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--surface);
      border-color: var(--line);
      padding: 16px;
      margin-bottom: 10px;
    }
    .choice strong { display: block; margin-bottom: 4px; }
    .choice span { color: var(--muted); font-size: 0.9rem; }

    .notice {
      background: var(--surface);
      border-left: 3px solid var(--accent);
      border-radius: 4px;
      padding: 10px 12px;
      margin: 8px 0 12px;
    }
    .log { margin-bottom: 8px; }

    /* Pausentimer */
    .timer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--surface);
      border-top: 1px solid var(--line);
      padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
    }
    .timer-inner {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #timer-text { flex: 1; font-variant-numeric: tabular-nums; }
    .timer button {
      padding: 8px 10px;
      background: var(--bg);
      border-color: var(--line);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="app.js"></script>
</body>
</html>
